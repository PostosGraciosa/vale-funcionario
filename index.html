<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema de Emissão de Vales</title>


<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
rel="stylesheet">


<link rel="stylesheet" href="css/style.css">


</head>


<body>


<div class="container mt-5 mb-5">

<div class="card">

<div class="card-header text-center">


<img 
src="img/logo.png" 
class="logo-sistema"
alt="Logo da Empresa">


<h2>
SISTEMA DE EMISSÃO DE VALES
</h2>


<p class="mb-0">
Emissão de Vale Funcionário
</p>


</div>



<div class="card-body">



<form id="formVale">



<div class="mb-3">

<label class="form-label">
Posto
</label>


<select 
class="form-select"
id="empresa"
required>


<option value="">
Selecione o posto
</option>


</select>


</div>





<div class="mb-3">

<label class="form-label">
CNPJ
</label>


<input 
type="text"
class="form-control"
id="cnpj"
readonly>


</div>





<div class="mb-3">

<label class="form-label">
Funcionário
</label>


<input 
type="text"
class="form-control"
id="funcionario"
placeholder="Nome completo do funcionário"
required>


</div>





<div class="mb-3">

<label class="form-label">
Valor do Vale
</label>


<div class="input-group">


<span class="input-group-text">
R$
</span>


<input 
type="number"
class="form-control"
id="valor"
placeholder="0,00"
step="0.01"
required>


</div>


</div>






<div class="mb-3">


<label class="form-label">
Motivo do Vale
</label>


<textarea

class="form-control"

id="motivo"

rows="4"

placeholder="Informe o motivo do vale"

required></textarea>


</div>







<div class="row">


<div class="col-md-6 mb-3">


<label class="form-label">
Número do Vale
</label>


<input 
type="text"
class="form-control"
id="numeroVale"
placeholder="Gerado automaticamente"
readonly>


</div>





<div class="col-md-6 mb-3">


<label class="form-label">
Data
</label>


<input 
type="date"
class="form-control"
id="dataVale"
required>


</div>


</div>







<div class="d-grid gap-3">

    <button
    type="button"
    class="btn btn-success btn-lg"
    id="btnA4">

        🖨️ Gerar Vale A4

    </button>

    <button
    type="button"
    class="btn btn-primary btn-lg"
    id="btnTermica">

    🧾 Imprimir na Impressora TEF

</button>
    
</div>


</form>



</div>


</div>


</div>





<script src="js/empresas.js"></script>

<script src="js/app.js"></script>


</body>

</html>
